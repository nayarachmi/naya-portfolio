<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coming Soon — Naya Kusuma</title>
  <style>
    :root {
      --bg-color: #FAF9F6;
      --text: #1D1D1F;
      --text-light: #6E6E73;
      --brand-primary: #1FB6A6;
      --brand-secondary: #4C5FEA;
      --brand-glow: rgba(31, 182, 166, 0.15);
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", sans-serif;
      background-color: var(--bg-color);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .ambient-glow {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none; z-index: 1;
    }
    .ambient-glow::before, .ambient-glow::after {
      content: ''; position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.6;
      animation: floatGlow 15s infinite alternate ease-in-out;
    }
    .ambient-glow::before {
      width: 600px; height: 600px; background: var(--brand-glow);
      top: -100px; left: -200px;
    }
    .ambient-glow::after {
      width: 500px; height: 500px; background: rgba(76, 95, 234, 0.12);
      bottom: -100px; right: -150px; animation-delay: -5s;
    }
    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(50px, 80px) scale(1.1); }
    }
    .alert-backdrop {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(250, 249, 246, 0.6); /* very light backdrop */
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .alert-box {
      width: 320px;
      background: #FFFFFF;
      border-radius: 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(0, 0, 0, 0.04);
      animation: revealUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0; transform: translateY(20px) scale(0.95);
    }
    @keyframes revealUp { to { opacity: 1; transform: translateY(0) scale(1); } }
    .alert-content {
      padding: 32px 24px 24px 24px;
    }
    .alert-emoji {
      font-size: 48px;
      margin-bottom: 16px;
      display: inline-block;
      animation: float 4s ease-in-out infinite;
    }
    .alert-title {
      font-size: 18px;
      font-weight: 700;
      color: #1D1D1F;
      margin: 0 0 8px 0;
      line-height: 1.3;
    }
    .alert-message {
      font-size: 14px;
      font-weight: 400;
      color: #6E6E73;
      margin: 0;
      line-height: 1.5;
    }
    .alert-actions {
      display: flex;
      border-top: 1px solid rgba(0, 0, 0, 0.06);
      height: 56px;
    }
    .alert-button {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #007AFF;
      text-decoration: none;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .alert-button:hover {
      background: rgba(0, 0, 0, 0.02);
    }
    .alert-button:active {
      background: rgba(0, 0, 0, 0.05);
    }
    .alert-button.cancel {
      font-weight: 500;
      border-bottom-left-radius: 24px;
    }
    .alert-button.default {
      font-weight: 600;
      border-left: 1px solid rgba(0, 0, 0, 0.06);
      border-bottom-right-radius: 24px;
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>
  <div class="alert-backdrop">
    <div class="alert-box">
      <div class="alert-content">
        <span class="alert-emoji">✨</span>
        <h2 class="alert-title">Coming Soon</h2>
        <p class="alert-message">I'm still putting the final touches on this pitch deck. Check back soon for the full strategic breakdown!</p>
      </div>
      <div class="alert-actions">
        <a href="index.html" class="alert-button cancel">Not Now</a>
        <a href="index.html" class="alert-button default">Go Back</a>
      </div>
    </div>
  </div>
</body>
</html>
